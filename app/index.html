<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Quincho</title>
<meta name="apple-mobile-web-app-title" content="El Quincho"><meta name="theme-color" content="#0c0c0c">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#0c0c0c;--fg:#f6f4f1;--muted:#a59f98;--accent:#d6955a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.45 "Open Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px max(18px,env(safe-area-inset-left,0px)) 40px max(18px,env(safe-area-inset-right,0px))}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(12,12,12,.5),rgba(12,12,12,.92) 55%),url(../fondo.jpg) center top/cover no-repeat}
img.logo{width:min(300px,78%);height:auto}
.place{margin-top:12px;font-size:12px;letter-spacing:.5em;text-transform:uppercase;padding-left:.5em}
.btn{display:block;width:min(340px,100%);margin-top:36px;padding:16px;border-radius:14px;background:var(--accent);color:#140c05;font-weight:600;font-size:17px;text-decoration:none;border:0;cursor:pointer}
.btn.sec{margin-top:12px;background:rgba(255,255,255,.08);color:var(--fg);font-size:15px}
.steps{margin-top:34px;max-width:34ch;text-align:left;color:var(--muted);font-size:15px}
.steps b{color:var(--fg)}
.steps ol{padding-left:20px;margin:8px 0 0}.steps li{margin:6px 0}
</style></head><body>
<div id="bg" aria-hidden="true"></div>
<img class="logo" src="../logo.png" alt="El Quincho" width="520" height="121">
<div class="place">Villa Ascasubi</div>
<a class="btn" id="go" href="https://claude.ai/artifact/A9pPHoC2dwHsy5WV7KsZUp">Abrir la app de mesas</a>
<div class="steps" id="steps">
  <b>Para tener el ícono en el celular</b>
  <ol>
    <li>iPhone: en Safari tocá <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.</li>
    <li>Android: en Chrome tocá el menú <b>⋮</b> → <b>Agregar a la pantalla principal</b>.</li>
    <li>Después tocá el botón de abajo.</li>
  </ol>
</div>
<button class="btn sec" id="done">Ya lo agregué: abrir directo la próxima vez</button>
<script>
(function(){
  var APP='https://claude.ai/artifact/A9pPHoC2dwHsy5WV7KsZUp',k='eq-app-ok';
  var ok=false;try{ok=localStorage.getItem(k)==='1'}catch(e){}
  if(ok){document.getElementById('steps').hidden=true;document.getElementById('done').hidden=true;location.replace(APP);return}
  document.getElementById('done').addEventListener('click',function(){try{localStorage.setItem(k,'1')}catch(e){}location.href=APP});
})();
</script>
</body></html>
